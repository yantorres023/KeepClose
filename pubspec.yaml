name: keepclose
description: "KeepClose — remember to ask. Gentle, private reminders about the people who matter."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.0
  flutter: ">=3.41.0"

dependencies:
  flutter:
    sdk: flutter
  drift: ^2.35.0
  drift_flutter: ^0.3.1
  flutter_local_notifications: ^22.3.1
  flutter_native_contact_picker: ^0.0.12
  flutter_timezone: ^5.1.0
  timezone: ^0.11.1
  url_launcher: ^6.3.2

dev_dependencies:
  build_runner: ^2.16.1
  drift_dev: ^2.35.0
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
